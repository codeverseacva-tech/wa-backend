name: Zaplink Backend CI/CD

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # This results in e.g. user/repo-name
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run Lint
        working-directory: backend
        run: npm run lint

      - name: Run Tests
        working-directory: backend
        run: npm test

      - name: Validate OpenAPI Spec
        working-directory: backend
        run: npm run validate:openapi

  build:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: SSH Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/zaplink/backend
            # Pull latest code to get newest deploy.sh if changed
            # Assuming the repo is already checked out on the VPS
            # Or at least simple pull for scripts
            # docker compose pull api
            /bin/bash ./deploy.sh ${{ github.sha }}

  notification:
    name: Notification
    needs: [test, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
          text: |
            ${{ job.status == 'success' && format(':white_check_mark: *Deployment SUCCESS* for {0}\n*Commit:* {1}\n*Branch:* {2}\n*Duration:* {3}', github.repository, github.sha, github.ref, '60s') || format(':x: *Deployment FAILED*!\n*Logs:* {0}/{1}/actions/runs/{2}\n*Rollback status:* Automated rollback initiated.', github.server_url, github.repository, github.run_id) }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
