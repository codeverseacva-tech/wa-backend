services:
  api:
    build:
      context: .
      target: development-runner
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    environment:
      API_BASE_URL: http://localhost:3000
      TEST_API_BASE_URL: http://localhost:3000
      NODE_ENV: development
      REHYDRATE_SESSIONS: "false"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: development-runner
    command: ["node", "dist/workers/index.js"]
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      REHYDRATE_SESSIONS: "false"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_local_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes
    restart: unless-stopped

  bullboard:
    image: deadly0/bull-board
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

volumes:
  redis_local_data:

networks:
  default:
    name: wa_local_network
